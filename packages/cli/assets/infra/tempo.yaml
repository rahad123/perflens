server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    pool:
      max_workers: 100
      queue_depth: 10000
compactor:
  compaction:
    block_retention: 24h
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: perflens-local
  storage:
    path: /var/tempo/generator/wal
    remote_write: []
