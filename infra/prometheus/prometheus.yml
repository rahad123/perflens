global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: demo-api
    static_configs:
      - targets: [demo-api:3000]
  - job_name: express-demo-api
    static_configs:
      - targets: [express-demo-api:3000]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
